services:
  db:
    image: postgres:17
    container_name: launchpad-db
    environment:
      POSTGRES_DB: launchpad
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad
    ports:
      - "5433:5432"
    volumes:
      - launchpad-db-data:/var/lib/postgresql/data

volumes:
  launchpad-db-data:
